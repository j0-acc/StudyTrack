<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Student StudyTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header id="nav"></header>

    <main>
      <section class="banner" aria-label="Welcome">
        <div>
          <p class="banner-date" id="today-date"></p>
          <h1 id="welcome">Welcome back!</h1>
          <p class="banner-tag">Keep the streak alive!</p>
          <div class="pills">
            <span class="pill">Total study time <span id="total-time">0m</span></span>
            <span class="pill">Best streak <span id="best-streak">0d</span></span>
          </div>
        </div>
        <a href="decks.html" class="btn btn-primary">Continue studying</a>
      </section>

      <h2 class="section-title">Your Topics</h2>
      <div class="chips" id="chips"></div>

      <div class="dash-grid">
        <section class="card" aria-label="Study streak calendar">
          <h2>Study streak</h2>
          <div class="cal-head">
            <button type="button" class="cal-nav" id="prev-month" aria-label="Previous month">&#8249;</button>
            <span id="cal-title"></span>
            <button type="button" class="cal-nav" id="next-month" aria-label="Next month">&#8250;</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <p class="cal-foot">Current streak: <strong id="current-streak">0 days</strong></p>
        </section>

        <section aria-label="Your subjects">
          <h2 class="section-title">Your Subjects</h2>
          <div class="subjects" id="subjects"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
