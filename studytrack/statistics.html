<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics — Student StudyTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/decks.css">
  <link rel="stylesheet" href="css/statistics.css">
</head>
<body>
  <div class="app">
    <header id="nav"></header>

    <main>
      <div class="page-head">
        <h1>Statistics</h1>
        <p>Track your learning progress over time.</p>
      </div>

      <section class="stat-grid" aria-label="Summary">
        <div class="stat">
          <span class="stat-icon" style="background:#ffe6c7;color:#e07f0c"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><small>Total Study Time</small><strong id="s-time">0m</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" style="background:#ff9d2e;color:#fff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3 0-5 2-8z"/></svg></span>
          <div><small>Current Streak</small><strong id="s-streak">0 days</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" style="background:#d9f5e3;color:#1f9d55"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
          <div><small>Cards Mastered</small><strong id="s-mastered">0</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" style="background:#e9e3fb;color:#7a5af8"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/></svg></span>
          <div><small>Quiz Average</small><strong id="s-quiz">—</strong></div>
        </div>
      </section>

      <div class="stack">
        <section class="card" aria-labelledby="goal-title">
          <div class="card-head">
            <h2 id="goal-title">Daily study goal</h2>
            <span id="goal-month-summary"></span>
          </div>
          <div class="goal-grid">
            <div>
              <div id="goal-progress"></div>
              <form class="goal-form" id="goal-form" novalidate>
                <div class="field">
                  <label for="goal-hours">Hours per day</label>
                  <input id="goal-hours" type="number" min="0.25" max="12" step="0.25" placeholder="e.g. 1.5">
                </div>
                <button type="submit" class="btn btn-primary" id="goal-save">Set goal</button>
                <button type="button" class="link-btn" id="goal-remove" hidden>Remove goal</button>
              </form>
              <p class="auth-message" id="goal-message" role="status" aria-live="polite"></p>
            </div>
            <div>
              <div class="days" id="goal-days" aria-label="This month"></div>
              <div class="legend">
                <span><i style="background:#2fbf71"></i>Goal met</span>
                <span><i style="background:#ffd9a8"></i>Not met</span>
                <span><i style="background:#ffe9c6"></i>Studied</span>
              </div>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="week-title">
          <div class="card-head">
            <h2 id="week-title">Weekly Activity</h2>
            <span id="week-total"></span>
          </div>
          <div class="week" id="week"></div>
        </section>

        <section class="card" aria-labelledby="perf-title">
          <div class="card-head"><h2 id="perf-title">Performance by Subject</h2></div>
          <div id="perf"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/statistics.js"></script>
</body>
</html>
